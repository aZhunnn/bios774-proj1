random_seed: 42

agent:
  max_iterations: 5
  max_experiments: 2
  max_analysis_steps: 20

llm:
  provider: mock
  model: mock
  temperature: 0

data:
  format: matrix_market
  orientation: features_by_samples
  sample_metadata_path: data/dataset_2/barcodes.tsv
  feature_metadata_path: data/dataset_2/genes.tsv
  sample_id_column: 0
  feature_id_column: 0
  feature_name_column: 1
  metadata_delimiter: "\t"
  metadata_has_header: false
  label_column: null

output:
  root: outputs

inspection:
  near_constant_threshold: 0.99
  high_cardinality_threshold: 50
  small_n_threshold: 10
  large_p_threshold: 1000
  high_dimensional_ratio_threshold: 5
  scaling_ratio_threshold: 100

evaluation:
  trustworthiness_neighbors: 10
  external_validation_neighbors: 10
  distance_sample_size: 1000
  stability_runs: 3
